"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$os\
$directory\
[](bg:yellow fg:blue)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:white)\
$time\
$cmd_duration\
$status\
$line_break\
$character"""

palette = 'solarized_dark'
add_newline = false

[os]
disabled = true
style = "bg:violet fg:crust"
format = '[$symbol]($style)[]($style fg:violet bg:blue)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "bg:magenta fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)[]($style fg:magenta bg:blue)'

[directory]
style = "bg:blue fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%T"
style = "bg:white"
format = '[[  $time ](fg:crust bg:white)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](bold fg:white)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:white)'
vimcmd_replace_symbol = '[❮](bold fg:white)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = '[[ $duration ](fg:crust bg:white)]($style)'
style = "bg:white"
disabled = false
show_notifications = true
min_time_to_notify = 30000
min_time = 500

[status]
symbol = "✘ "
success_symbol = ""
style = "bg:red fg:black"
pipestatus = true
pipestatus_format = '[$pipestatus]($style)'
pipestatus_separator = "|"
format = '[](bold fg:white bg:red)[ $symbol$common_meaning$signal_name$maybe_int ]($style)'
map_symbol = true
disabled = false

[palettes.solarized_dark]
crust   = "#001e26"
base03  = "#002b36"
base02  = "#073642"
white   = "#93a1a1"
bright_white = "#fdf6e3"
yellow  = "#b58900"
peach   = "#bd5b13"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"
